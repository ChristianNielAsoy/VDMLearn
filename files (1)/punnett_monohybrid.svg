<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Punnett square Aa by Aa</title><desc id="d">Monohybrid cross giving a 1:2:1 genotype ratio and a 3:1 phenotype ratio.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1a1a1a}.s{stroke:#333;stroke-width:2.5}.b{font-weight:bold}.sm{font-size:14px;fill:#333}.md{font-size:17px}</style><rect width="700" height="350" fill="#ffffff"/>

<text x="350" y="36" text-anchor="middle" class="b" font-size="22">Monohybrid cross: Aa x Aa</text>
<text x="275" y="82" text-anchor="middle" class="b md">Parent 2 gametes</text>
<text x="40" y="215" class="b md" transform="rotate(-90 40 215)" text-anchor="middle">Parent 1 gametes</text>
<text x="215" y="118" text-anchor="middle" class="b" font-size="22">A</text><text x="335" y="118" text-anchor="middle" class="b" font-size="22">a</text>
<text x="130" y="178" text-anchor="middle" class="b" font-size="22">A</text><text x="130" y="258" text-anchor="middle" class="b" font-size="22">a</text>
<rect class="s" x="160" y="130" width="110" height="80" fill="#cfe8c4"/><rect class="s" x="280" y="130" width="110" height="80" fill="#cfe8c4"/>
<rect class="s" x="160" y="210" width="110" height="80" fill="#cfe8c4"/><rect class="s" x="280" y="210" width="110" height="80" fill="#f3c3cf"/>
<text x="215" y="180" text-anchor="middle" class="b" font-size="24">AA</text><text x="335" y="180" text-anchor="middle" class="b" font-size="24">Aa</text>
<text x="215" y="260" text-anchor="middle" class="b" font-size="24">Aa</text><text x="335" y="260" text-anchor="middle" class="b" font-size="24">aa</text>
<text x="430" y="170" class="md"><tspan class="b">Genotype ratio</tspan></text><text x="430" y="194" class="md">1 AA : 2 Aa : 1 aa</text>
<text x="430" y="228" class="md"><tspan class="b">Phenotype ratio</tspan></text><text x="430" y="252" class="md">3 dominant : 1 recessive</text>
<text x="430" y="276" class="sm">(complete dominance)</text>
<text x="30" y="335" class="sm">Green = dominant phenotype, pink = recessive. Own drawing (CC0).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>