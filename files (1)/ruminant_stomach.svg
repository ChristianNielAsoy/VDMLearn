<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 535" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Ruminant stomach (schematic)</title><desc id="d">Four compartments: rumen, reticulum, omasum and abomasum, with the esophagus entering at the reticulorumen and the duodenum leaving the abomasum.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1a1a1a}.s{stroke:#333;stroke-width:2.5}.b{font-weight:bold}.sm{font-size:14px;fill:#333}.md{font-size:17px}</style><rect width="800" height="535" fill="#ffffff"/>

<path id="esophagus" d="M430 40 C440 90 468 130 492 183" fill="none" stroke="#333" stroke-width="26" stroke-linecap="round"/>
<path d="M430 40 C440 90 468 130 492 183" fill="none" stroke="#e8c4ae" stroke-width="19" stroke-linecap="round"/>
<ellipse id="rumen" class="s" cx="290" cy="295" rx="215" ry="160" fill="#cfe8c4"/>
<circle id="reticulum" class="s" cx="548" cy="222" r="60" fill="#c6dcf2"/>
<ellipse id="omasum" class="s" cx="645" cy="350" rx="62" ry="68" fill="#f6dbb0"/>
<ellipse id="abomasum" class="s" cx="510" cy="452" rx="108" ry="42" fill="#f3c3cf"/>
<path id="duodenum" d="M616 452 C660 455 700 462 752 470" fill="none" stroke="#333" stroke-width="26" stroke-linecap="round"/>
<path d="M616 452 C660 455 700 462 752 470" fill="none" stroke="#f0d9a8" stroke-width="19" stroke-linecap="round"/>
<path d="M580 275 Q612 285 632 296" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M614 408 Q600 420 592 428" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="290" y="292" text-anchor="middle" class="b" font-size="24">RUMEN</text>
<text x="290" y="318" text-anchor="middle" class="sm">fermentation vat (microbes, VFAs)</text>
<text x="548" y="218" text-anchor="middle" class="b" font-size="16">RETICULUM</text>
<text x="548" y="238" text-anchor="middle" class="sm">honeycomb</text>
<text x="645" y="348" text-anchor="middle" class="b" font-size="18">OMASUM</text>
<text x="645" y="368" text-anchor="middle" class="sm">laminae</text>
<text x="500" y="458" text-anchor="middle" class="b" font-size="20">ABOMASUM</text>
<text x="500" y="478" text-anchor="middle" class="sm">true (glandular) stomach</text>
<text x="400" y="62" text-anchor="end" class="b md">Esophagus</text>
<text x="400" y="82" text-anchor="end" class="sm">(feed in; cud back up)</text>
<text x="672" y="438" class="b md">To duodenum</text>
<text x="30" y="524" class="sm">Schematic, not to scale. Arrows show the forward flow of ingesta. Own drawing (CC0).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>