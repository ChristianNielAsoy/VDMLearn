<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Fasciola hepatica life cycle (schematic)</title><desc id="d">Ten numbered stages from adult fluke in the bile ducts through eggs, miracidium, snail stages, metacercariae on vegetation, ingestion, and liver migration back to adults.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1a1a1a}.s{stroke:#333;stroke-width:2.5}.b{font-weight:bold}.sm{font-size:14px;fill:#333}</style>
<rect width="1000" height="720" fill="#ffffff"/>
<line x1="682.6" y1="123.4" x2="742.2" y2="151.9" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="824.0" y1="216.5" x2="863.5" y2="296.5" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="863.5" y1="363.5" x2="824.0" y2="443.5" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="742.2" y1="508.1" x2="682.6" y2="536.6" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="506.4" y1="567.8" x2="493.6" y2="567.8" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="317.4" y1="536.6" x2="257.8" y2="508.1" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="176.0" y1="443.5" x2="136.5" y2="363.5" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="136.5" y1="296.5" x2="176.0" y2="216.5" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="257.8" y1="151.9" x2="317.4" y2="123.4" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="493.6" y1="92.2" x2="506.4" y2="92.2" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
<rect class="s" x="511.4" y="63.2" width="212" height="58" rx="10" fill="#c6dcf2"/><text x="617.4" y="88.2" text-anchor="middle" class="b" font-size="15">1. Adult fluke in bile ducts</text><text x="617.4" y="108.2" text-anchor="middle" class="sm">(ruminant host); lays eggs</text><rect class="s" x="701.4" y="154.1" width="212" height="58" rx="10" fill="#f6dbb0"/><text x="807.4" y="179.1" text-anchor="middle" class="b" font-size="15">2. Eggs passed in feces</text><rect class="s" x="774.0" y="301.0" width="212" height="58" rx="10" fill="#f6dbb0"/><text x="880.0" y="326.0" text-anchor="middle" class="b" font-size="15">3. Egg embryonates in water</text><text x="880.0" y="346.0" text-anchor="middle" class="sm">miracidium hatches</text><rect class="s" x="701.4" y="447.9" width="212" height="58" rx="10" fill="#cfe8c4"/><text x="807.4" y="472.9" text-anchor="middle" class="b" font-size="15">4. Miracidium enters snail</text><text x="807.4" y="492.9" text-anchor="middle" class="sm">(Lymnaeidae)</text><rect class="s" x="511.4" y="538.8" width="212" height="58" rx="10" fill="#cfe8c4"/><text x="617.4" y="563.8" text-anchor="middle" class="b" font-size="15">5. Sporocyst, then redia</text><text x="617.4" y="583.8" text-anchor="middle" class="sm">inside the snail</text><rect class="s" x="276.6" y="538.8" width="212" height="58" rx="10" fill="#cfe8c4"/><text x="382.6" y="563.8" text-anchor="middle" class="b" font-size="15">6. Cercariae leave the snail</text><rect class="s" x="86.6" y="447.9" width="212" height="58" rx="10" fill="#f6dbb0"/><text x="192.6" y="472.9" text-anchor="middle" class="b" font-size="15">7. Encyst on vegetation</text><text x="192.6" y="492.9" text-anchor="middle" class="sm">metacercariae (infective)</text><rect class="s" x="14.0" y="301.0" width="212" height="58" rx="10" fill="#c6dcf2"/><text x="120.0" y="326.0" text-anchor="middle" class="b" font-size="15">8. Host eats metacercariae</text><text x="120.0" y="346.0" text-anchor="middle" class="sm">while grazing</text><rect class="s" x="86.6" y="154.1" width="212" height="58" rx="10" fill="#c6dcf2"/><text x="192.6" y="179.1" text-anchor="middle" class="b" font-size="15">9. Excyst in small intestine</text><text x="192.6" y="199.1" text-anchor="middle" class="sm">penetrate gut wall</text><rect class="s" x="276.6" y="63.2" width="212" height="58" rx="10" fill="#c6dcf2"/><text x="382.6" y="88.2" text-anchor="middle" class="b" font-size="15">10. Migrate through liver</text><text x="382.6" y="108.2" text-anchor="middle" class="sm">reach bile ducts, mature</text><text x="500" y="322" text-anchor="middle" class="b" font-size="24">Fasciola hepatica</text><text x="500" y="350" text-anchor="middle" class="sm" font-size="16">liver fluke life cycle</text><rect x="40" y="650" width="22" height="16" class="s" fill="#c6dcf2"/><text x="70" y="663" class="sm">Definitive (ruminant) host</text>
<rect x="290" y="650" width="22" height="16" class="s" fill="#cfe8c4"/><text x="320" y="663" class="sm">Snail intermediate host</text>
<rect x="520" y="650" width="22" height="16" class="s" fill="#f6dbb0"/><text x="550" y="663" class="sm">Free-living / environment</text>
<text x="40" y="700" class="sm">Schematic of the Fasciola hepatica life cycle, simplified. Own drawing (CC0).</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>