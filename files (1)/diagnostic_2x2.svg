<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Diagnostic test 2 by 2 table</title><desc id="d">Table of test result against disease status with formulas for sensitivity, specificity, positive and negative predictive value.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1a1a1a}.s{stroke:#333;stroke-width:2.5}.b{font-weight:bold}.sm{font-size:14px;fill:#333}.md{font-size:17px}</style><rect width="720" height="470" fill="#ffffff"/>

<text x="360" y="38" text-anchor="middle" class="b" font-size="22">Diagnostic test 2 x 2 table</text>
<text x="330" y="82" text-anchor="middle" class="b md">Disease present</text>
<text x="530" y="82" text-anchor="middle" class="b md">Disease absent</text>
<text x="160" y="150" text-anchor="end" class="b md">Test positive</text>
<text x="160" y="250" text-anchor="end" class="b md">Test negative</text>
<rect class="s" x="230" y="100" width="200" height="90" fill="#cfe8c4"/>
<rect class="s" x="430" y="100" width="200" height="90" fill="#f3c3cf"/>
<rect class="s" x="230" y="190" width="200" height="90" fill="#f3c3cf"/>
<rect class="s" x="430" y="190" width="200" height="90" fill="#cfe8c4"/>
<text x="330" y="140" text-anchor="middle" class="b" font-size="22">a = TP</text><text x="330" y="165" text-anchor="middle" class="sm">true positive</text>
<text x="530" y="140" text-anchor="middle" class="b" font-size="22">b = FP</text><text x="530" y="165" text-anchor="middle" class="sm">false positive</text>
<text x="330" y="230" text-anchor="middle" class="b" font-size="22">c = FN</text><text x="330" y="255" text-anchor="middle" class="sm">false negative</text>
<text x="530" y="230" text-anchor="middle" class="b" font-size="22">d = TN</text><text x="530" y="255" text-anchor="middle" class="sm">true negative</text>
<text x="40" y="330" class="md"><tspan class="b">Sensitivity</tspan> = a / (a + c)   (diseased animals the test catches)</text>
<text x="40" y="358" class="md"><tspan class="b">Specificity</tspan> = d / (b + d)   (healthy animals the test clears)</text>
<text x="40" y="386" class="md"><tspan class="b">PPV</tspan> = a / (a + b)   (positive result is truly diseased)</text>
<text x="40" y="414" class="md"><tspan class="b">NPV</tspan> = d / (c + d)   (negative result is truly healthy)</text>
<text x="40" y="450" class="sm">PPV and NPV change with prevalence; sensitivity and specificity do not. Own drawing (CC0).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>